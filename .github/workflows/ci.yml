name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check declared toolchain
        run: .\dd.ps1 doctor --json

      - name: Build Release and Debug past dd's time limit
        # dd stops a build after ten minutes, and building all five releases and their libraries from nothing
        # takes a hosted runner longer. The trees are built here with dd's presets and compiler environment;
        # dd test then finds them current.
        run: |
          $environment = (pwsh -NoProfile -File dd.ps1 env --json --non-interactive | ConvertFrom-Json).data.environment
          foreach ($name in $environment.PSObject.Properties.Name) { Set-Item "env:$name" $environment.$name }
          foreach ($preset in 'x64-release', 'x64-debug') {
            cmake --preset $preset
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build --preset $preset --parallel
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Build, test and smoke-test Debug and Release
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          Start-Transcript -Path "$env:RUNNER_TEMP\imagewalker-test.log"
          try {
            & .\dd.ps1 test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Stop-Transcript
          }

      - name: Validate help links and strict CHM build
        run: .\dd.ps1 check-help --yes

      - name: Build and test the x86 release
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.ATL -property installationPath
          if (-not $vs) { throw 'Visual Studio 2026 with ATL is required.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          & $env:ComSpec /d /c "call `"$vcvars`" x64_x86 >nul && cmake --preset x86-release && cmake --build --preset x86-release --parallel"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset x86-release -L headless --no-tests=error

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/imagewalker-test.log
            ${{ runner.temp }}/dd-logs/*.log
            ${{ runner.temp }}/dd-ctest-*.xml
            build/*/Testing/Temporary/LastTest.log
            exe/*.log
